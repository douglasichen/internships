<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internship Radar</title>
<style>
  :root {
    --bg: #FAF9F5;
    --surface: #FFFFFF;
    --surface-alt: #F1EEE5;
    --text: #2A2723;
    --text-muted: #8A8478;
    --accent: #C96442;
    --accent-soft: #F1DFD1;
    --border: #E6E2D6;
    --teal: #4A7C6F;
    --plum: #7D6B91;
    --gold: #B98A3E;
    --slate: #4A6B8A;
    --rose: #9B5B6A;
    --serif: Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  header.hero {
    max-width: 880px;
    margin: 0 auto;
    padding: 56px 24px 32px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }
  .pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(201,100,66,0.35); }
    50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(201,100,66,0); }
  }
  .hero-count {
    font-family: var(--serif);
    font-size: clamp(52px, 9vw, 84px);
    line-height: 1;
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  .hero-label {
    font-family: var(--serif);
    font-style: italic;
    font-size: 22px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .hero-sub {
    margin-top: 14px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .filters {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(250, 249, 245, 0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
  }
  .filters-inner {
    max-width: 880px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  #search {
    flex: 1 1 220px;
    font: inherit;
    font-size: 14px;
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--text);
  }
  #search:focus, .chip:focus-visible, .toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .chip {
    font: inherit;
    font-size: 13px;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 120ms, color 120ms, border-color 120ms;
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .chip.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }
  .chip.active .dot { background: var(--bg) !important; }
  .toggle {
    font: inherit;
    font-size: 13px;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
  }
  .toggle:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .toggle.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  #filtersToggle {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  #filtersToggle .caret { transition: transform 120ms; font-size: 10px; }
  #filtersToggle.open .caret { transform: rotate(180deg); }
  .filter-details {
    display: none;
    flex-basis: 100%;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .filter-details.open { display: flex; }
  /* One row: Scrape | Recompute | shared status. Mutual exclusion via disabled. */
  .run-actions {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }
  .run-actions .toggle.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .run-actions .toggle.primary:hover:not(:disabled) { filter: brightness(0.96); }
  .run-actions .toggle.primary:disabled { filter: none; }
  .run-status {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    min-height: 1.2em;
  }
  .run-status.live {
    color: var(--accent);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .run-status.live::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) { .run-status.live::before { animation: none; } }

  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 8px 24px 80px;
  }

  .run-group { margin-top: 36px; }
  .run-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .run-date {
    font-family: var(--serif);
    font-size: 17px;
  }
  .run-relative {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
  }
  .run-count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
  }

  ul.roles { list-style: none; margin: 0; padding: 0; }
  .role {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--border);
  }
  .role:hover { background: var(--surface-alt); margin: 0 -4px; padding-left: 8px; padding-right: 8px; border-radius: 8px; }
  .role-main { flex: 1; min-width: 0; }
  .role-title { font-weight: 600; font-size: 15px; }
  /* Shared title badges: main rows (.role-title) and applied-sibling rows
     (.sibling-title). Without the sibling selectors, "2027"/"P1" render as
     bare text and concatenate with titles that already end in a year
     (e.g. "Winter 2027" + "2027" → "Winter 20272027"). */
  .role-title .y2027, .sibling-title .y2027 {
    display: inline-block;
    margin-left: 8px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 1px 6px;
    border-radius: 4px;
    vertical-align: middle;
  }
  .role-title .p1, .role-title .p2,
  .sibling-title .p1, .sibling-title .p2 {
    display: inline-block;
    margin-left: 8px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 1px 6px;
    border-radius: 4px;
    vertical-align: middle;
  }
  .role-title .p1, .sibling-title .p1 {
    font-weight: 700;
    color: #fff;
    background: var(--gold);
  }
  .role-title .p2, .sibling-title .p2 {
    color: var(--gold);
    background: #F3E7D0;
  }
  .role-title .workday, .sibling-title .workday {
    display: inline-block;
    margin-left: 8px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--slate);
    background: #E4EBF2;
    padding: 1px 6px;
    border-radius: 4px;
    vertical-align: middle;
  }
  .role-meta {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .source-badge {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 5px;
    color: #fff;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .apply-link {
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    white-space: nowrap;
  }
  .apply-link:hover { text-decoration: underline; }
  .applied-checkbox {
    flex-shrink: 0;
    width: 17px;
    height: 17px;
    accent-color: var(--teal);
    cursor: pointer;
  }
  .role.applied { opacity: 0.55; }
  .role.applied .role-title { text-decoration: line-through; }
  /* Last row where you clicked Apply — survives refresh so you can find it again. */
  .role.last-apply {
    background: var(--accent-soft);
    border-radius: 8px;
    box-shadow: inset 3px 0 0 var(--accent);
    opacity: 1; /* keep visible even if also .applied */
  }
  .role.last-apply .role-title { text-decoration: none; }
  .role.last-apply .apply-link {
    color: #fff;
    background: var(--accent);
    padding: 4px 10px;
    border-radius: 6px;
  }
  .last-apply-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }

  .role-wrap { border-bottom: 1px solid var(--border); }
  .role-wrap > .role { border-bottom: none; }
  /* Inline in .role-meta so collapsed rows keep the same height as plain rows. */
  .company-more {
    font: inherit;
    font-size: inherit;
    color: var(--teal);
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    display: inline;
    vertical-align: baseline;
  }
  .company-more:hover { color: var(--accent); text-decoration: underline; }
  .company-more .caret {
    font-size: 9px;
    display: inline-block;
    transition: transform 120ms;
    margin-right: 2px;
  }
  .company-more.open .caret { transform: rotate(90deg); }
  .company-more:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }
  ul.siblings {
    list-style: none;
    margin: 0 4px 12px 35px;
    padding: 0;
    border-left: 2px solid var(--border);
    max-height: 280px;
    overflow-y: auto;
  }
  .sibling {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0 7px 12px;
    font-size: 13px;
  }
  .sibling + .sibling { border-top: 1px solid var(--border); }
  .sibling-main { flex: 1; min-width: 0; }
  .sibling-title { font-weight: 500; }
  .sibling-meta {
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sibling.applied { opacity: 0.55; }
  .sibling.applied .sibling-title { text-decoration: line-through; }
  .sibling-applied-badge {
    flex-shrink: 0;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--teal);
    background: #E4EFEC;
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
  }
  /* Missing description: compact badge that is also the submit CTA. */
  .no-desc {
    flex-shrink: 0;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--rose);
    background: #F3E4E7;
    border: none;
    padding: 3px 8px;
    border-radius: 5px;
    white-space: nowrap;
    cursor: pointer;
  }
  .no-desc:hover { background: #E9D0D6; color: #7A3E4B; }
  .no-desc:focus-visible {
    outline: 2px solid var(--rose);
    outline-offset: 2px;
  }

  .desc-modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(42, 39, 35, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .desc-modal-backdrop[hidden] { display: none; }
  .desc-modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: min(520px, 100%);
    padding: 20px 22px;
    box-shadow: 0 12px 40px rgba(42, 39, 35, 0.18);
  }
  .desc-modal h2 {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 400;
    margin: 0 0 4px;
  }
  .desc-modal .desc-modal-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }
  .desc-modal textarea {
    width: 100%;
    min-height: 180px;
    resize: vertical;
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .desc-modal textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .desc-modal-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 12px;
  }
  .desc-modal-actions .toggle { cursor: pointer; }
  .desc-modal-actions .primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .desc-modal-actions .primary:hover { filter: brightness(0.95); }
  .desc-modal-actions .primary:disabled { opacity: 0.55; cursor: default; }
  .desc-modal-status {
    font-size: 12px;
    color: var(--text-muted);
    margin-left: auto;
  }
  .desc-modal-status.err { color: var(--rose); }

  .empty {
    text-align: center;
    padding: 100px 24px;
    color: var(--text-muted);
  }
  .empty .headline { font-family: var(--serif); font-size: 22px; color: var(--text); margin-bottom: 8px; }
  .empty code {
    font-family: var(--mono);
    background: var(--surface-alt);
    padding: 2px 6px;
    border-radius: 4px;
  }

  @media (max-width: 520px) {
    .role { flex-wrap: wrap; }
    .role-main { flex-basis: 100%; }
    .run-count { display: none; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="eyebrow"><span class="pulse"></span> Internship Radar</div>
  <div class="hero-count" id="heroCount">–</div>
  <div class="hero-label" id="heroLabel">roles found</div>
  <div class="hero-sub" id="heroSub"></div>
  <div class="run-actions">
    <button type="button" class="toggle primary" id="runScrape" title="Fetch new listings from all sources">Scrape</button>
    <button type="button" class="toggle" id="runRecompute" title="Dedupe + refresh 2027 / priority / descriptions">Recompute</button>
    <span class="run-status" id="runStatus"></span>
  </div>
</header>

<div class="filters">
  <div class="filters-inner">
    <input id="search" type="text" placeholder="Search company, title, or location…" autocomplete="off">
    <button id="filtersToggle" class="toggle" aria-expanded="false">Filters <span class="caret">▾</span></button>
    <div class="filter-details" id="filterDetails">
      <button class="chip" data-source="ats_boards"><span class="dot" style="background:var(--teal)"></span>Job boards</button>
      <button class="chip" data-source="custom_boards"><span class="dot" style="background:var(--rose)"></span>Custom</button>
      <button class="chip" data-source="github_readme"><span class="dot" style="background:var(--plum)"></span>vanshb03</button>
      <button class="chip" data-source="speedyapply"><span class="dot" style="background:var(--gold)"></span>speedyapply</button>
      <button class="chip" data-source="sndsh404"><span class="dot" style="background:var(--slate)"></span>sndsh404</button>
      <button class="toggle active" id="toggle2027">2027 only</button>
      <button class="toggle active" id="toggleNA">North America</button>
      <button class="toggle" id="toggleP12">P1+P2 only</button>
      <button class="toggle" id="toggleP1">P1 only</button>
      <button class="toggle" id="toggleHideApplied">Hide applied</button>
      <button class="toggle" id="toggleAppliedOnly">Applied only</button>
    </div>
  </div>
</div>

<main id="main">
  <div class="empty">Loading…</div>
</main>

<div class="desc-modal-backdrop" id="descModal" hidden>
  <div class="desc-modal" role="dialog" aria-modal="true" aria-labelledby="descModalTitle">
    <h2 id="descModalTitle">Add description</h2>
    <div class="desc-modal-sub" id="descModalSub"></div>
    <textarea id="descModalText" placeholder="Paste the job description (plain text or HTML)…"></textarea>
    <div class="desc-modal-actions">
      <button type="button" class="toggle primary" id="descModalSave">Save</button>
      <button type="button" class="toggle" id="descModalCancel">Cancel</button>
      <span class="desc-modal-status" id="descModalStatus"></span>
    </div>
  </div>
</div>

<script>
const SOURCE_COLOR = {
  ats_boards: 'var(--teal)',
  custom_boards: 'var(--rose)',
  github_readme: 'var(--plum)',
  speedyapply: 'var(--gold)',
  sndsh404: 'var(--slate)',
};
const SOURCE_LABEL = {
  ats_boards: 'Job boards',
  custom_boards: 'Custom',
  github_readme: 'vanshb03',
  speedyapply: 'speedyapply',
  sndsh404: 'sndsh404',
};

const state = {
  query: '',
  sources: new Set(Object.keys(SOURCE_COLOR)),
  only2027: true,
  onlyNA: true, // US or Canada locations only
  priorityFilter: 'all', // 'all' | 'p12' | 'p1'
  hideApplied: false,
  appliedOnly: false,
};

let ALL = [];
// listing ids that already have a description body in out/descriptions.json.gz
let descIds = new Set();
// listing id -> open/closed for "N more at Company" expanders (survives re-render)
const expandedRoles = new Set();
// id currently open in the "add description" modal (null when closed)
let descModalId = null;

// "Applied" is manual -- never touched by the scraper. Durable source of
// truth is out/applied.json via /api/applied (survives localhost vs
// 127.0.0.1 origin splits). localStorage is a mirror for static file opens.
const APPLIED_KEY = 'internships-applied';
// Listing id of the most recent "Apply →" click (local only; find-your-place marker).
const LAST_APPLY_KEY = 'internships-last-apply';
function loadLastApplyId() {
  try { return localStorage.getItem(LAST_APPLY_KEY) || ''; }
  catch { return ''; }
}
function saveLastApplyId(id) {
  try {
    if (id) localStorage.setItem(LAST_APPLY_KEY, id);
    else localStorage.removeItem(LAST_APPLY_KEY);
  } catch { /* private mode etc. */ }
}
let lastApplyId = loadLastApplyId();
// Scroll to last-apply row once after load (and when the marker moves).
let lastApplyShouldScroll = !!lastApplyId;

function loadAppliedLocal() {
  try { return new Map(Object.entries(JSON.parse(localStorage.getItem(APPLIED_KEY) || '{}'))); }
  catch { return new Map(); }
}
function saveAppliedLocal(m) {
  localStorage.setItem(APPLIED_KEY, JSON.stringify(Object.fromEntries(m)));
}
function saveApplied(m) {
  saveAppliedLocal(m);
  // Fire-and-forget server write; local already updated.
  fetch('/api/applied', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.fromEntries(m)),
  }).catch(() => {});
}
function mergeAppliedMaps(a, b) {
  // Later ISO timestamp wins per id.
  const out = new Map(a);
  for (const [k, v] of b) {
    if (!out.has(k) || v > out.get(k)) out.set(k, v);
  }
  return out;
}
let applied = loadAppliedLocal();

function companyKey(name) {
  return (name || '').trim().toLowerCase();
}

// Same posting often appears once per location (and again from another
// source) with the same path but different Listing.ids. Collapse those
// for "applied siblings" so one Rippling UUID doesn't show as 3 applied.
function postingKey(r) {
  const u = r && r.url;
  if (!u) return r && r.id ? 'id:' + r.id : '';
  try {
    const parsed = new URL(u, 'https://example.invalid');
    return (parsed.host + parsed.pathname).toLowerCase().replace(/\/$/, '');
  } catch {
    return String(u).split('?')[0].split('#')[0].toLowerCase();
  }
}

// Index all listings by company so each row can show siblings.
// Built once per render from ALL (not filtered) — "what else did they post"
// should not disappear when you filter this view.
function indexByCompany(rows) {
  const map = new Map();
  for (const r of rows) {
    const k = companyKey(r.company);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(r);
  }
  for (const list of map.values()) {
    list.sort((a, b) => (b.scraped_at || '').localeCompare(a.scraped_at || '')
      || a.title.localeCompare(b.title));
  }
  return map;
}

function renderSiblings(siblings) {
  // Read-only list of already-applied roles at the same company.
  return `<ul class="siblings">${siblings.map(s => {
    const appliedAt = applied.get(s.id);
    const meta = [
      s.location || '',
      s.scraped_at ? relativeTime(s.scraped_at) : '',
    ].filter(Boolean).join(' · ');
    return `
      <li class="sibling applied">
        <div class="sibling-main">
          <div class="sibling-title">${escapeHtml(s.title)}${titleBadges(s)}</div>
          ${meta ? `<div class="sibling-meta">${escapeHtml(meta)}</div>` : ''}
        </div>
        ${appliedAt
          ? `<span class="sibling-applied-badge" title="${new Date(appliedAt).toLocaleString()}">Applied ${relativeTime(appliedAt)}</span>`
          : ''}
      </li>`;
  }).join('')}</ul>`;
}

function relativeTime(iso) {
  const then = new Date(iso), now = new Date();
  const mins = Math.round((now - then) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.round(hrs / 24);
  return `${days}d ago`;
}

function formatRunDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) +
    ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Workday apply links: myworkdayjobs.com hosts (incl. wdN.*) and /wday/cxs/ API paths.
function isWorkdayUrl(u) {
  if (!u) return false;
  const s = String(u).toLowerCase();
  return s.includes('myworkdayjobs.com') || s.includes('/wday/cxs/');
}

function titleBadges(r) {
  return (r.is_2027 ? '<span class="y2027">2027</span>' : '')
    + (r.priority === 1 ? '<span class="p1">P1</span>' : r.priority === 2 ? '<span class="p2">P2</span>' : '')
    + (isWorkdayUrl(r.url) ? '<span class="workday" title="Workday application">Workday</span>' : '');
}

// True if location looks like US and/or Canada. Multi-site strings match if
// any segment is NA. Empty/unknown location does not match (filter stays strict).
function isNorthAmericaLocation(loc) {
  if (!loc || !String(loc).trim()) return false;
  const s = String(loc);
  // Country / region
  if (/\b(united states|u\.s\.a?\.?|\busa\b|canada|canadian|north america)\b/i.test(s)) return true;
  // US state codes (e.g. "Seattle, WA") + DC
  if (/\b(AL|AK|AZ|AR|CA|CO|CT|DE|FL|GA|HI|ID|IL|IN|IA|KS|KY|LA|ME|MD|MA|MI|MN|MS|MO|MT|NE|NV|NH|NJ|NM|NY|NC|ND|OH|OK|OR|PA|RI|SC|SD|TN|TX|UT|VT|VA|WA|WV|WI|WY|DC)\b/.test(s)) return true;
  // Canadian province codes (e.g. "Toronto, ON")
  if (/\b(ON|BC|AB|QC|MB|SK|NS|NB|NL|PE|YT|NT|NU)\b/.test(s)) return true;
  // Full state / province names
  if (/\b(California|New York|Texas|Washington|Massachusetts|Illinois|Georgia|Florida|Colorado|Oregon|Arizona|Pennsylvania|Virginia|North Carolina|South Carolina|Michigan|Ohio|New Jersey|Maryland|Minnesota|Wisconsin|Missouri|Tennessee|Indiana|Nevada|Utah|Connecticut|Kentucky|Louisiana|Alabama|Oklahoma|Iowa|Arkansas|Kansas|Mississippi|New Mexico|Nebraska|Idaho|Hawaii|New Hampshire|Maine|Montana|Rhode Island|Delaware|Alaska|Vermont|Wyoming|District of Columbia)\b/i.test(s)) return true;
  if (/\b(Ontario|Quebec|British Columbia|Alberta|Manitoba|Saskatchewan|Nova Scotia|New Brunswick|Newfoundland|Prince Edward Island)\b/i.test(s)) return true;
  // Common cities / remote phrasing
  if (/\b(Toronto|Vancouver|Montreal|Ottawa|Calgary|Edmonton|Waterloo|Kitchener|Seattle|San Francisco|\bSF\b|NYC|Bay Area|Palo Alto|Mountain View|Menlo Park|Sunnyvale|Cupertino|Redmond|Austin|Boston|Chicago|Los Angeles|\bLA\b|San Jose|San Diego|Denver|Atlanta|Miami|Dallas|Houston|Bellevue|Brooklyn|Manhattan|Remote\s*US|US\s*Remote|multiple US)\b/i.test(s)) return true;
  return false;
}

// escapeHtml alone does NOT neutralize a scraped `javascript:`/`data:` URL --
// those schemes contain no HTML metacharacters, so they'd survive untouched
// into href= and execute on click. Listing URLs come from arbitrary external
// job boards/READMEs, so allowlist http/https (returns '' for anything else).
function safeUrl(u) {
  // Require an absolute http(s) URL in the listing data itself. A relative
  // path like "/job/..." (seen when Workday externalPath failed to resolve)
  // would otherwise resolve against our own origin via `new URL(u, location)`
  // and look "safe" while pointing at localhost:8765/job/... instead of the
  // employer's career site.
  try {
    if (typeof u !== 'string' || !/^https?:\/\//i.test(u)) return '';
    const proto = new URL(u).protocol;
    return proto === 'http:' || proto === 'https:' ? u : '';
  } catch { return ''; }
}

function applyFilters(rows) {
  const q = state.query.trim().toLowerCase();
  return rows.filter(r => {
    if (!state.sources.has(r.source)) return false;
    if (state.only2027 && !r.is_2027) return false;
    if (state.onlyNA && !isNorthAmericaLocation(r.location)) return false;
    if (state.priorityFilter === 'p1' && r.priority !== 1) return false;
    if (state.priorityFilter === 'p12' && r.priority > 2) return false;
    if (state.hideApplied && applied.has(r.id)) return false;
    if (state.appliedOnly && !applied.has(r.id)) return false;
    if (q && !(r.company.toLowerCase().includes(q) || r.title.toLowerCase().includes(q) || (r.location || '').toLowerCase().includes(q))) return false;
    return true;
  });
}

function render() {
  const visible = applyFilters(ALL);
  document.getElementById('heroCount').textContent = visible.length;
  document.getElementById('heroLabel').textContent = visible.length === 1 ? 'role found' : 'roles found';

  const main = document.getElementById('main');
  if (ALL.length === 0) {
    main.innerHTML = `<div class="empty">
      <div class="headline">No scrapes yet</div>
      Run <code>python3 -m internships</code> from the repo root to fetch the first batch.
    </div>`;
    document.getElementById('heroSub').textContent = '';
    return;
  }
  if (visible.length === 0) {
    main.innerHTML = `<div class="empty">
      <div class="headline">Nothing matches</div>
      Try a different search or turn a filter back on.
    </div>`;
    return;
  }

  const latest = ALL.reduce((a, b) => a.scraped_at > b.scraped_at ? a : b);
  document.getElementById('heroSub').textContent =
    `Across ${Object.keys(SOURCE_COLOR).length} sources · last scrape ${relativeTime(latest.scraped_at)}`;

  const byCompany = indexByCompany(ALL);

  const groups = new Map();
  for (const r of visible) {
    if (!groups.has(r.scraped_at)) groups.set(r.scraped_at, []);
    groups.get(r.scraped_at).push(r);
  }
  const runs = [...groups.keys()].sort().reverse();

  main.innerHTML = runs.map(run => {
    const items = groups.get(run).sort((a, b) => a.company.localeCompare(b.company));
    const roleHtml = items.map(r => {
      const appliedAt = applied.get(r.id);
      const url = safeUrl(r.url);
      const ck = companyKey(r.company);
      const companyRoles = byCompany.get(ck) || [];
      const selfPosting = postingKey(r);
      // Other applied roles at this company: exclude this row and any row that
      // is the same posting URL (location/source clones of the same job).
      const appliedOthers = companyRoles.filter(s =>
        s.id !== r.id && applied.has(s.id) && postingKey(s) !== selfPosting);

      const nApplied = appliedOthers.length;
      const open = nApplied > 0 && expandedRoles.has(r.id);
      const appliedCta = nApplied > 0
        ? ` · <button type="button" class="company-more${open ? ' open' : ''}" data-role-id="${escapeHtml(r.id)}" aria-expanded="${open}" title="Roles at ${escapeHtml(r.company)} you've already applied to"><span class="caret">▸</span>${nApplied} applied</button>`
        : '';

      const isLastApply = lastApplyId && r.id === lastApplyId;
      return `
      <li class="role-wrap"${isLastApply ? ' id="last-apply-row"' : ''}>
        <div class="role${appliedAt ? ' applied' : ''}${isLastApply ? ' last-apply' : ''}">
          <input type="checkbox" class="applied-checkbox" data-id="${r.id}" ${appliedAt ? 'checked' : ''} title="Mark applied">
          <div class="role-main">
            <div class="role-title">${escapeHtml(r.title)}${titleBadges(r)}</div>
            <div class="role-meta">${escapeHtml(r.company)}${r.location ? ' · ' + escapeHtml(r.location) : ''}${appliedAt ? ` · <span title="${new Date(appliedAt).toLocaleString()}">Applied ${relativeTime(appliedAt)}</span>` : ''}${isLastApply ? ' · <span class="last-apply-label">Last opened</span>' : ''}${appliedCta}</div>
          </div>
          ${!descIds.has(r.id)
            ? `<button type="button" class="no-desc" data-id="${escapeHtml(r.id)}" title="Description missing — click to submit one">No desc</button>`
            : ''}
          <span class="source-badge" style="background:${SOURCE_COLOR[r.source] || 'var(--text-muted)'}">${SOURCE_LABEL[r.source] || escapeHtml(r.source || '')}</span>
          ${url ? `<a class="apply-link" href="${escapeHtml(url)}" target="_blank" rel="noopener" data-id="${escapeHtml(r.id)}">Apply →</a>` : ''}
        </div>
        ${open ? renderSiblings(appliedOthers) : ''}
      </li>`;
    }).join('');
    return `
      <section class="run-group">
        <div class="run-header">
          <span class="run-date">${formatRunDate(run)}</span>
          <span class="run-relative">${relativeTime(run)}</span>
          <span class="run-count">${items.length} role${items.length === 1 ? '' : 's'}</span>
        </div>
        <ul class="roles">${roleHtml}</ul>
      </section>`;
  }).join('');

  // After a full re-render, keep the last Apply row in view if it exists.
  // Only scroll on first paint after load / when the marker moves (not every filter tick).
  if (lastApplyId && lastApplyShouldScroll) {
    lastApplyShouldScroll = false;
    const el = document.getElementById('last-apply-row');
    if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}

document.querySelectorAll('.chip').forEach(chip => {
  chip.classList.add('active');
  chip.addEventListener('click', () => {
    const src = chip.dataset.source;
    if (state.sources.has(src)) { state.sources.delete(src); chip.classList.remove('active'); }
    else { state.sources.add(src); chip.classList.add('active'); }
    render();
  });
});
document.getElementById('filtersToggle').addEventListener('click', e => {
  const open = document.getElementById('filterDetails').classList.toggle('open');
  e.currentTarget.classList.toggle('open', open);
  e.currentTarget.setAttribute('aria-expanded', open);
});
document.getElementById('toggle2027').addEventListener('click', e => {
  state.only2027 = !state.only2027;
  e.target.classList.toggle('active', state.only2027);
  render();
});
document.getElementById('toggleNA').addEventListener('click', e => {
  state.onlyNA = !state.onlyNA;
  e.target.classList.toggle('active', state.onlyNA);
  render();
});
document.getElementById('toggleP12').addEventListener('click', e => {
  state.priorityFilter = state.priorityFilter === 'p12' ? 'all' : 'p12';
  e.target.classList.toggle('active', state.priorityFilter === 'p12');
  document.getElementById('toggleP1').classList.remove('active');
  render();
});
document.getElementById('toggleP1').addEventListener('click', e => {
  state.priorityFilter = state.priorityFilter === 'p1' ? 'all' : 'p1';
  e.target.classList.toggle('active', state.priorityFilter === 'p1');
  document.getElementById('toggleP12').classList.remove('active');
  render();
});
document.getElementById('toggleHideApplied').addEventListener('click', e => {
  state.hideApplied = !state.hideApplied;
  e.target.classList.toggle('active', state.hideApplied);
  if (state.hideApplied && state.appliedOnly) {
    state.appliedOnly = false;
    document.getElementById('toggleAppliedOnly').classList.remove('active');
  }
  render();
});
document.getElementById('toggleAppliedOnly').addEventListener('click', e => {
  state.appliedOnly = !state.appliedOnly;
  e.target.classList.toggle('active', state.appliedOnly);
  if (state.appliedOnly && state.hideApplied) {
    state.hideApplied = false;
    document.getElementById('toggleHideApplied').classList.remove('active');
  }
  render();
});
document.getElementById('search').addEventListener('input', e => {
  state.query = e.target.value;
  render();
});
document.getElementById('main').addEventListener('change', e => {
  const cb = e.target.closest('.applied-checkbox');
  if (!cb) return;
  const id = cb.dataset.id;
  if (cb.checked) applied.set(id, new Date().toISOString());
  else applied.delete(id);
  saveApplied(applied);
  render();
});
document.getElementById('main').addEventListener('click', e => {
  const more = e.target.closest('.company-more');
  if (more) {
    const id = more.dataset.roleId;
    if (expandedRoles.has(id)) expandedRoles.delete(id);
    else expandedRoles.add(id);
    render();
    return;
  }
  const applyLink = e.target.closest('.apply-link');
  if (applyLink) {
    // Mark this row as last-opened Apply so it's obvious when you come back.
    // Don't preventDefault / re-render — that can cancel the new-tab navigation.
    const id = applyLink.dataset.id;
    if (!id) return;
    lastApplyId = id;
    saveLastApplyId(id);
    // In-place highlight update (no full render).
    document.querySelectorAll('#last-apply-row').forEach(el => el.removeAttribute('id'));
    document.querySelectorAll('.role.last-apply').forEach(el => {
      el.classList.remove('last-apply');
      el.querySelectorAll('.last-apply-label').forEach(lab => {
        // strip leading " · " text node if present
        const prev = lab.previousSibling;
        if (prev && prev.nodeType === 3 && /^\s*·\s*$/.test(prev.textContent)) prev.remove();
        lab.remove();
      });
    });
    const row = applyLink.closest('.role');
    const wrap = applyLink.closest('.role-wrap');
    if (wrap) wrap.id = 'last-apply-row';
    if (row) {
      row.classList.add('last-apply');
      const meta = row.querySelector('.role-meta');
      if (meta && !meta.querySelector('.last-apply-label')) {
        meta.insertAdjacentHTML('beforeend', ' · <span class="last-apply-label">Last opened</span>');
      }
    }
    return;
  }
  const noDesc = e.target.closest('.no-desc');
  if (noDesc) {
    openDescModal(noDesc.dataset.id);
  }
});

function openDescModal(id) {
  const row = ALL.find(r => r.id === id);
  descModalId = id;
  const modal = document.getElementById('descModal');
  document.getElementById('descModalSub').textContent = row
    ? `${row.company || ''} — ${row.title || ''}`.replace(/^ — | — $/g, '')
    : id;
  document.getElementById('descModalText').value = '';
  const status = document.getElementById('descModalStatus');
  status.textContent = '';
  status.classList.remove('err');
  document.getElementById('descModalSave').disabled = false;
  modal.hidden = false;
  document.getElementById('descModalText').focus();
}

function closeDescModal() {
  descModalId = null;
  document.getElementById('descModal').hidden = true;
}

document.getElementById('descModalCancel').addEventListener('click', closeDescModal);
document.getElementById('descModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeDescModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && descModalId) closeDescModal();
});
document.getElementById('descModalSave').addEventListener('click', async () => {
  const id = descModalId;
  if (!id) return;
  const text = document.getElementById('descModalText').value;
  const status = document.getElementById('descModalStatus');
  const btn = document.getElementById('descModalSave');
  if (!text.trim()) {
    status.textContent = 'paste something first';
    status.classList.add('err');
    return;
  }
  btn.disabled = true;
  status.textContent = 'saving…';
  status.classList.remove('err');
  try {
    const res = await fetch('/api/descriptions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, text }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      status.textContent = err.error || `failed (${res.status})`;
      status.classList.add('err');
      btn.disabled = false;
      return;
    }
    descIds.add(id);
    closeDescModal();
    render();
  } catch {
    status.textContent = 'no server — start: python3 -m internships.webserver';
    status.classList.add('err');
    btn.disabled = false;
  }
});

function loadDescIds() {
  return fetch('/api/descriptions/ids')
    .then(r => r.ok ? r.json() : { ids: [] })
    .catch(() => ({ ids: [] }))
    .then(data => {
      descIds = new Set(Array.isArray(data.ids) ? data.ids : []);
    });
}

function loadAppliedRemote() {
  // Merge server + localStorage so neither origin's empty map wipes the other.
  return fetch('/api/applied')
    .then(r => r.ok ? r.json() : {})
    .catch(() => ({}))
    .then(remote => {
      const remoteMap = new Map(
        Object.entries(remote || {}).filter(([k, v]) => k && typeof v === 'string')
      );
      const localMap = loadAppliedLocal();
      const merged = mergeAppliedMaps(localMap, remoteMap);
      applied = merged;
      saveAppliedLocal(merged);
      // If local had marks the server didn't, push the union up.
      const remoteCount = remoteMap.size;
      if (merged.size > remoteCount ||
          [...merged].some(([k, v]) => !remoteMap.has(k) || remoteMap.get(k) !== v)) {
        fetch('/api/applied?merge=1', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(merged)),
        }).catch(() => {});
      }
    });
}

function loadAll() {
  return Promise.all([
    fetch('/out/all.json').then(r => r.ok ? r.json() : []).catch(() => []),
    loadDescIds(),
    loadAppliedRemote(),
  ]).then(([data]) => { ALL = data; render(); });
}

// Shared busy gate: scrape and recompute share .run.lock. Both buttons disable
// whenever either is in flight. One status line covers both.
// Recompute always runs every field (dedup, is_2027, priority, descriptions).
const RECOMPUTE_FIELDS = 'dedup,is_2027,priority,descriptions';
let scrapeWasActive = false;
let recomputeWasActive = false;
let pendingUiScrape = false;
let pendingUiRecompute = false;
let scrapePostInFlight = false;
let recomputePostInFlight = false;

function runStatusEl() { return document.getElementById('runStatus'); }

function setRunButtonsBusy(busy) {
  const on = !!busy;
  document.getElementById('runScrape').disabled = on;
  document.getElementById('runRecompute').disabled = on;
}

function setRunStatus(text, live) {
  const el = runStatusEl();
  el.textContent = text || '';
  el.classList.toggle('live', !!live);
}

function anyRunPending() {
  return scrapePostInFlight || recomputePostInFlight
    || pendingUiScrape || pendingUiRecompute
    || scrapeWasActive || recomputeWasActive;
}

function pollRunBusy() {
  Promise.all([
    fetch('/api/status').then(r => r.json()),
    fetch('/api/scrape/status').then(r => r.json()).catch(() => ({ running: false })),
    fetch('/api/recompute/status').then(r => r.json()).catch(() => ({ running: false })),
  ]).then(([s, scrape, recompute]) => {
    const lockHeld = !!s.active;
    const scrapeRunning = !!scrape.running;
    const recomputeRunning = !!recompute.running;

    // This-tab scrape finished: surface result once.
    if (pendingUiScrape && !scrapeRunning && !scrapePostInFlight && !lockHeld && !recomputeRunning) {
      pendingUiScrape = false;
      scrapeWasActive = false;
      loadAll();
      if (scrape.result) setRunStatus(`scrape done — ${scrape.result.new_listings} new`, false);
      else if (scrape.error) setRunStatus('scrape error: ' + scrape.error, false);
      else setRunStatus('', false);
    }

    // This-tab recompute finished: surface result once.
    if (pendingUiRecompute && !recomputeRunning && !recomputePostInFlight && !lockHeld && !scrapeRunning) {
      pendingUiRecompute = false;
      recomputeWasActive = false;
      loadAll();
      if (recompute.error) setRunStatus('recompute error: ' + recompute.error, false);
      else {
        const summary = Object.entries(recompute.result || {})
          .map(([k, v]) => `${k}: ${v}`).join(' · ') || 'done';
        setRunStatus('recompute done — ' + summary, false);
      }
    }

    const busy = scrapePostInFlight || recomputePostInFlight
      || lockHeld || scrapeRunning || recomputeRunning;
    setRunButtonsBusy(busy);

    if (scrapeRunning || scrapePostInFlight) {
      scrapeWasActive = true;
      if (!scrapePostInFlight || scrapeRunning) setRunStatus('scraping…', true);
    } else if (recomputeRunning || recomputePostInFlight) {
      recomputeWasActive = true;
      if (!recomputePostInFlight || recomputeRunning) setRunStatus('recomputing…', true);
    } else if (lockHeld) {
      scrapeWasActive = true;
      setRunStatus('run in progress…', true);
    } else if (scrapeWasActive && !pendingUiScrape) {
      scrapeWasActive = false;
      loadAll();
      // Don't clear a result line that was just set above.
      if (runStatusEl().classList.contains('live')) setRunStatus('', false);
    } else if (recomputeWasActive && !pendingUiRecompute) {
      recomputeWasActive = false;
      if (runStatusEl().classList.contains('live')) setRunStatus('', false);
    }
  }).catch(() => {});
  setTimeout(pollRunBusy, anyRunPending() ? 1000 : 4000);
}

document.getElementById('runRecompute').addEventListener('click', async () => {
  const btn = document.getElementById('runRecompute');
  if (btn.disabled || recomputePostInFlight || scrapePostInFlight
      || pendingUiScrape || pendingUiRecompute) return;
  recomputePostInFlight = true;
  setRunButtonsBusy(true);
  setRunStatus('starting recompute…', true);
  try {
    const res = await fetch(`/api/recompute?fields=${RECOMPUTE_FIELDS}`, { method: 'POST' });
    if (res.status === 202) {
      setRunStatus('recomputing…', true);
      recomputeWasActive = true;
      pendingUiRecompute = true;
      return;
    }
    if (res.status === 409) {
      setRunStatus('already running…', true);
      recomputeWasActive = true;
      return;
    }
    const err = await res.json().catch(() => ({}));
    setRunStatus(err.error || `failed (${res.status})`, false);
    setRunButtonsBusy(false);
  } catch {
    setRunStatus('no server — python3 -m internships.webserver', false);
    setRunButtonsBusy(false);
  } finally {
    recomputePostInFlight = false;
  }
});

document.getElementById('runScrape').addEventListener('click', async () => {
  const btn = document.getElementById('runScrape');
  if (btn.disabled || scrapePostInFlight || recomputePostInFlight
      || pendingUiScrape || pendingUiRecompute) return;
  scrapePostInFlight = true;
  setRunButtonsBusy(true);
  setRunStatus('starting scrape…', true);
  try {
    const res = await fetch('/api/scrape', { method: 'POST' });
    if (res.status === 202) {
      setRunStatus('scraping…', true);
      scrapeWasActive = true;
      pendingUiScrape = true;
      return;
    }
    if (res.status === 409) {
      setRunStatus('already running…', true);
      scrapeWasActive = true;
      return;
    }
    const err = await res.json().catch(() => ({}));
    setRunStatus(err.error || `failed (${res.status})`, false);
    setRunButtonsBusy(false);
  } catch {
    setRunStatus('no server — python3 -m internships.webserver', false);
    setRunButtonsBusy(false);
  } finally {
    scrapePostInFlight = false;
  }
});

loadAll();
pollRunBusy();
</script>
