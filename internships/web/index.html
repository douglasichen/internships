<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internship Radar</title>
<style>
  :root {
    --bg: #FAF9F5;
    --surface: #FFFFFF;
    --surface-alt: #F1EEE5;
    --text: #2A2723;
    --text-muted: #8A8478;
    --accent: #C96442;
    --accent-soft: #F1DFD1;
    --border: #E6E2D6;
    --teal: #4A7C6F;
    --plum: #7D6B91;
    --gold: #B98A3E;
    --slate: #4A6B8A;
    --serif: Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  header.hero {
    max-width: 880px;
    margin: 0 auto;
    padding: 56px 24px 32px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }
  .pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(201,100,66,0.35); }
    50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(201,100,66,0); }
  }
  .hero-count {
    font-family: var(--serif);
    font-size: clamp(52px, 9vw, 84px);
    line-height: 1;
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  .hero-label {
    font-family: var(--serif);
    font-style: italic;
    font-size: 22px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .hero-sub {
    margin-top: 14px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .filters {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(250, 249, 245, 0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
  }
  .filters-inner {
    max-width: 880px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  #search {
    flex: 1 1 220px;
    font: inherit;
    font-size: 14px;
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--text);
  }
  #search:focus, .chip:focus-visible, .toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .chip {
    font: inherit;
    font-size: 13px;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 120ms, color 120ms, border-color 120ms;
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .chip.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }
  .chip.active .dot { background: var(--bg) !important; }
  .toggle {
    font: inherit;
    font-size: 13px;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
  }
  .toggle.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  #filtersToggle {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  #filtersToggle .caret { transition: transform 120ms; font-size: 10px; }
  #filtersToggle.open .caret { transform: rotate(180deg); }
  .filter-details {
    display: none;
    flex-basis: 100%;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .filter-details.open { display: flex; }
  .recompute-row {
    flex-basis: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .recompute-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .recompute-status {
    font-size: 12px;
    color: var(--text-muted);
    flex-basis: 100%;
  }
  .scrape-row {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .scrape-status {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
  }
  .scrape-status.live {
    color: var(--accent);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .scrape-status.live::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) { .scrape-status.live::before { animation: none; } }

  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 8px 24px 80px;
  }

  .run-group { margin-top: 36px; }
  .run-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .run-date {
    font-family: var(--serif);
    font-size: 17px;
  }
  .run-relative {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
  }
  .run-count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
  }

  ul.roles { list-style: none; margin: 0; padding: 0; }
  .role {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--border);
  }
  .role:hover { background: var(--surface-alt); margin: 0 -4px; padding-left: 8px; padding-right: 8px; border-radius: 8px; }
  .role-main { flex: 1; min-width: 0; }
  .role-title { font-weight: 600; font-size: 15px; }
  .role-title .y2027 {
    display: inline-block;
    margin-left: 8px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 1px 6px;
    border-radius: 4px;
    vertical-align: middle;
  }
  .role-title .p1, .role-title .p2 {
    display: inline-block;
    margin-left: 8px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 1px 6px;
    border-radius: 4px;
    vertical-align: middle;
  }
  .role-title .p1 {
    font-weight: 700;
    color: #fff;
    background: var(--gold);
  }
  .role-title .p2 {
    color: var(--gold);
    background: #F3E7D0;
  }
  .role-meta {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .source-badge {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 5px;
    color: #fff;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .apply-link {
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    white-space: nowrap;
  }
  .apply-link:hover { text-decoration: underline; }
  .applied-checkbox {
    flex-shrink: 0;
    width: 17px;
    height: 17px;
    accent-color: var(--teal);
    cursor: pointer;
  }
  .role.applied { opacity: 0.55; }
  .role.applied .role-title { text-decoration: line-through; }

  .role-wrap { border-bottom: 1px solid var(--border); }
  .role-wrap > .role { border-bottom: none; }
  /* Inline in .role-meta so collapsed rows keep the same height as plain rows. */
  .company-more {
    font: inherit;
    font-size: inherit;
    color: var(--teal);
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    display: inline;
    vertical-align: baseline;
  }
  .company-more:hover { color: var(--accent); text-decoration: underline; }
  .company-more .caret {
    font-size: 9px;
    display: inline-block;
    transition: transform 120ms;
    margin-right: 2px;
  }
  .company-more.open .caret { transform: rotate(90deg); }
  .company-more:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }
  ul.siblings {
    list-style: none;
    margin: 0 4px 12px 35px;
    padding: 0;
    border-left: 2px solid var(--border);
    max-height: 280px;
    overflow-y: auto;
  }
  .sibling {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0 7px 12px;
    font-size: 13px;
  }
  .sibling + .sibling { border-top: 1px solid var(--border); }
  .sibling-main { flex: 1; min-width: 0; }
  .sibling-title { font-weight: 500; }
  .sibling-meta {
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sibling.applied { opacity: 0.55; }
  .sibling.applied .sibling-title { text-decoration: line-through; }
  .sibling-applied-badge {
    flex-shrink: 0;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--teal);
    background: #E4EFEC;
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .empty {
    text-align: center;
    padding: 100px 24px;
    color: var(--text-muted);
  }
  .empty .headline { font-family: var(--serif); font-size: 22px; color: var(--text); margin-bottom: 8px; }
  .empty code {
    font-family: var(--mono);
    background: var(--surface-alt);
    padding: 2px 6px;
    border-radius: 4px;
  }

  @media (max-width: 520px) {
    .role { flex-wrap: wrap; }
    .role-main { flex-basis: 100%; }
    .run-count { display: none; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="eyebrow"><span class="pulse"></span> Internship Radar</div>
  <div class="hero-count" id="heroCount">–</div>
  <div class="hero-label" id="heroLabel">roles found</div>
  <div class="hero-sub" id="heroSub"></div>
  <div class="scrape-row">
    <button class="toggle" id="runScrape">Run scrape</button>
    <span class="scrape-status" id="scrapeStatus"></span>
  </div>
</header>

<div class="filters">
  <div class="filters-inner">
    <input id="search" type="text" placeholder="Search company or title…" autocomplete="off">
    <button id="filtersToggle" class="toggle" aria-expanded="false">Filters <span class="caret">▾</span></button>
    <div class="filter-details" id="filterDetails">
      <button class="chip" data-source="ats_boards"><span class="dot" style="background:var(--teal)"></span>Job boards</button>
      <button class="chip" data-source="github_readme"><span class="dot" style="background:var(--plum)"></span>vanshb03</button>
      <button class="chip" data-source="speedyapply"><span class="dot" style="background:var(--gold)"></span>speedyapply</button>
      <button class="chip" data-source="sndsh404"><span class="dot" style="background:var(--slate)"></span>sndsh404</button>
      <button class="toggle active" id="toggle2027">2027 only</button>
      <button class="toggle" id="toggleP12">P1+P2 only</button>
      <button class="toggle" id="toggleP1">P1 only</button>
      <button class="toggle" id="toggleHideApplied">Hide applied</button>
      <button class="toggle" id="toggleAppliedOnly">Applied only</button>
      <div class="recompute-row">
        <span class="recompute-label">Recompute</span>
        <button class="toggle recompute-check active" data-field="dedup">dedup</button>
        <button class="toggle recompute-check" data-field="is_2027">is_2027</button>
        <button class="toggle recompute-check" data-field="priority">priority</button>
        <button class="toggle recompute-check" data-field="descriptions">descriptions</button>
        <button class="toggle" id="runRecompute">Run</button>
        <span class="recompute-status" id="recomputeStatus"></span>
      </div>
    </div>
  </div>
</div>

<main id="main">
  <div class="empty">Loading…</div>
</main>

<script>
const SOURCE_COLOR = {
  ats_boards: 'var(--teal)',
  github_readme: 'var(--plum)',
  speedyapply: 'var(--gold)',
  sndsh404: 'var(--slate)',
};
const SOURCE_LABEL = {
  ats_boards: 'Job boards',
  github_readme: 'vanshb03',
  speedyapply: 'speedyapply',
  sndsh404: 'sndsh404',
};

const state = {
  query: '',
  sources: new Set(Object.keys(SOURCE_COLOR)),
  only2027: true,
  priorityFilter: 'all', // 'all' | 'p12' | 'p1'
  hideApplied: false,
  appliedOnly: false,
};

let ALL = [];
// listing id -> open/closed for "N more at Company" expanders (survives re-render)
const expandedRoles = new Set();

// "Applied" is manual, per-browser state -- never touched by the scraper,
// so it survives out/all.json being regenerated/appended on every run.
// Maps listing id -> ISO timestamp of when it was marked applied.
const APPLIED_KEY = 'internships-applied';
function loadApplied() {
  try { return new Map(Object.entries(JSON.parse(localStorage.getItem(APPLIED_KEY) || '{}'))); }
  catch { return new Map(); }
}
function saveApplied(m) { localStorage.setItem(APPLIED_KEY, JSON.stringify(Object.fromEntries(m))); }
let applied = loadApplied();

function companyKey(name) {
  return (name || '').trim().toLowerCase();
}

// Index all listings by company so each row can show siblings.
// Built once per render from ALL (not filtered) — "what else did they post"
// should not disappear when you filter this view.
function indexByCompany(rows) {
  const map = new Map();
  for (const r of rows) {
    const k = companyKey(r.company);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(r);
  }
  for (const list of map.values()) {
    list.sort((a, b) => (b.scraped_at || '').localeCompare(a.scraped_at || '')
      || a.title.localeCompare(b.title));
  }
  return map;
}

function renderSiblings(siblings) {
  // Read-only list of already-applied roles at the same company.
  return `<ul class="siblings">${siblings.map(s => {
    const appliedAt = applied.get(s.id);
    const meta = [
      s.location || '',
      s.scraped_at ? relativeTime(s.scraped_at) : '',
    ].filter(Boolean).join(' · ');
    return `
      <li class="sibling applied">
        <div class="sibling-main">
          <div class="sibling-title">${escapeHtml(s.title)}${s.is_2027 ? '<span class="y2027">2027</span>' : ''}${s.priority === 1 ? '<span class="p1">P1</span>' : s.priority === 2 ? '<span class="p2">P2</span>' : ''}</div>
          ${meta ? `<div class="sibling-meta">${escapeHtml(meta)}</div>` : ''}
        </div>
        ${appliedAt
          ? `<span class="sibling-applied-badge" title="${new Date(appliedAt).toLocaleString()}">Applied ${relativeTime(appliedAt)}</span>`
          : ''}
      </li>`;
  }).join('')}</ul>`;
}

function relativeTime(iso) {
  const then = new Date(iso), now = new Date();
  const mins = Math.round((now - then) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.round(hrs / 24);
  return `${days}d ago`;
}

function formatRunDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) +
    ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// escapeHtml alone does NOT neutralize a scraped `javascript:`/`data:` URL --
// those schemes contain no HTML metacharacters, so they'd survive untouched
// into href= and execute on click. Listing URLs come from arbitrary external
// job boards/READMEs, so allowlist http/https (returns '' for anything else).
function safeUrl(u) {
  try {
    const proto = new URL(u, location.href).protocol;
    return proto === 'http:' || proto === 'https:' ? u : '';
  } catch { return ''; }
}

function applyFilters(rows) {
  const q = state.query.trim().toLowerCase();
  return rows.filter(r => {
    if (!state.sources.has(r.source)) return false;
    if (state.only2027 && !r.is_2027) return false;
    if (state.priorityFilter === 'p1' && r.priority !== 1) return false;
    if (state.priorityFilter === 'p12' && r.priority > 2) return false;
    if (state.hideApplied && applied.has(r.id)) return false;
    if (state.appliedOnly && !applied.has(r.id)) return false;
    if (q && !(r.company.toLowerCase().includes(q) || r.title.toLowerCase().includes(q))) return false;
    return true;
  });
}

function render() {
  const visible = applyFilters(ALL);
  document.getElementById('heroCount').textContent = visible.length;
  document.getElementById('heroLabel').textContent = visible.length === 1 ? 'role found' : 'roles found';

  const main = document.getElementById('main');
  if (ALL.length === 0) {
    main.innerHTML = `<div class="empty">
      <div class="headline">No scrapes yet</div>
      Run <code>python3 -m internships</code> from the repo root to fetch the first batch.
    </div>`;
    document.getElementById('heroSub').textContent = '';
    return;
  }
  if (visible.length === 0) {
    main.innerHTML = `<div class="empty">
      <div class="headline">Nothing matches</div>
      Try a different search or turn a filter back on.
    </div>`;
    return;
  }

  const latest = ALL.reduce((a, b) => a.scraped_at > b.scraped_at ? a : b);
  document.getElementById('heroSub').textContent =
    `Across ${Object.keys(SOURCE_COLOR).length} sources · last scrape ${relativeTime(latest.scraped_at)}`;

  const byCompany = indexByCompany(ALL);

  const groups = new Map();
  for (const r of visible) {
    if (!groups.has(r.scraped_at)) groups.set(r.scraped_at, []);
    groups.get(r.scraped_at).push(r);
  }
  const runs = [...groups.keys()].sort().reverse();

  main.innerHTML = runs.map(run => {
    const items = groups.get(run).sort((a, b) => a.company.localeCompare(b.company));
    const roleHtml = items.map(r => {
      const appliedAt = applied.get(r.id);
      const url = safeUrl(r.url);
      const ck = companyKey(r.company);
      const companyRoles = byCompany.get(ck) || [];
      // Only roles at this company the user has already applied to (excluding this row).
      const appliedOthers = companyRoles.filter(s => s.id !== r.id && applied.has(s.id));

      const nApplied = appliedOthers.length;
      const open = nApplied > 0 && expandedRoles.has(r.id);
      const appliedCta = nApplied > 0
        ? ` · <button type="button" class="company-more${open ? ' open' : ''}" data-role-id="${escapeHtml(r.id)}" aria-expanded="${open}" title="Roles at ${escapeHtml(r.company)} you've already applied to"><span class="caret">▸</span>${nApplied} applied</button>`
        : '';

      return `
      <li class="role-wrap">
        <div class="role${appliedAt ? ' applied' : ''}">
          <input type="checkbox" class="applied-checkbox" data-id="${r.id}" ${appliedAt ? 'checked' : ''} title="Mark applied">
          <div class="role-main">
            <div class="role-title">${escapeHtml(r.title)}${r.is_2027 ? '<span class="y2027">2027</span>' : ''}${r.priority === 1 ? '<span class="p1">P1</span>' : r.priority === 2 ? '<span class="p2">P2</span>' : ''}</div>
            <div class="role-meta">${escapeHtml(r.company)}${r.location ? ' · ' + escapeHtml(r.location) : ''}${appliedAt ? ` · <span title="${new Date(appliedAt).toLocaleString()}">Applied ${relativeTime(appliedAt)}</span>` : ''}${appliedCta}</div>
          </div>
          <span class="source-badge" style="background:${SOURCE_COLOR[r.source]}">${SOURCE_LABEL[r.source]}</span>
          ${url ? `<a class="apply-link" href="${escapeHtml(url)}" target="_blank" rel="noopener">Apply →</a>` : ''}
        </div>
        ${open ? renderSiblings(appliedOthers) : ''}
      </li>`;
    }).join('');
    return `
      <section class="run-group">
        <div class="run-header">
          <span class="run-date">${formatRunDate(run)}</span>
          <span class="run-relative">${relativeTime(run)}</span>
          <span class="run-count">${items.length} role${items.length === 1 ? '' : 's'}</span>
        </div>
        <ul class="roles">${roleHtml}</ul>
      </section>`;
  }).join('');
}

document.querySelectorAll('.chip').forEach(chip => {
  chip.classList.add('active');
  chip.addEventListener('click', () => {
    const src = chip.dataset.source;
    if (state.sources.has(src)) { state.sources.delete(src); chip.classList.remove('active'); }
    else { state.sources.add(src); chip.classList.add('active'); }
    render();
  });
});
document.getElementById('filtersToggle').addEventListener('click', e => {
  const open = document.getElementById('filterDetails').classList.toggle('open');
  e.currentTarget.classList.toggle('open', open);
  e.currentTarget.setAttribute('aria-expanded', open);
});
document.getElementById('toggle2027').addEventListener('click', e => {
  state.only2027 = !state.only2027;
  e.target.classList.toggle('active', state.only2027);
  render();
});
document.getElementById('toggleP12').addEventListener('click', e => {
  state.priorityFilter = state.priorityFilter === 'p12' ? 'all' : 'p12';
  e.target.classList.toggle('active', state.priorityFilter === 'p12');
  document.getElementById('toggleP1').classList.remove('active');
  render();
});
document.getElementById('toggleP1').addEventListener('click', e => {
  state.priorityFilter = state.priorityFilter === 'p1' ? 'all' : 'p1';
  e.target.classList.toggle('active', state.priorityFilter === 'p1');
  document.getElementById('toggleP12').classList.remove('active');
  render();
});
document.getElementById('toggleHideApplied').addEventListener('click', e => {
  state.hideApplied = !state.hideApplied;
  e.target.classList.toggle('active', state.hideApplied);
  if (state.hideApplied && state.appliedOnly) {
    state.appliedOnly = false;
    document.getElementById('toggleAppliedOnly').classList.remove('active');
  }
  render();
});
document.getElementById('toggleAppliedOnly').addEventListener('click', e => {
  state.appliedOnly = !state.appliedOnly;
  e.target.classList.toggle('active', state.appliedOnly);
  if (state.appliedOnly && state.hideApplied) {
    state.hideApplied = false;
    document.getElementById('toggleHideApplied').classList.remove('active');
  }
  render();
});
document.querySelectorAll('.recompute-check').forEach(btn => {
  btn.addEventListener('click', () => btn.classList.toggle('active'));
});
document.getElementById('search').addEventListener('input', e => {
  state.query = e.target.value;
  render();
});
document.getElementById('main').addEventListener('change', e => {
  const cb = e.target.closest('.applied-checkbox');
  if (!cb) return;
  const id = cb.dataset.id;
  if (cb.checked) applied.set(id, new Date().toISOString());
  else applied.delete(id);
  saveApplied(applied);
  render();
});
document.getElementById('main').addEventListener('click', e => {
  const btn = e.target.closest('.company-more');
  if (!btn) return;
  const id = btn.dataset.roleId;
  if (expandedRoles.has(id)) expandedRoles.delete(id);
  else expandedRoles.add(id);
  render();
});

function loadAll() {
  return fetch('/out/all.json')
    .then(r => r.ok ? r.json() : [])
    .catch(() => [])
    .then(data => { ALL = data; render(); });
}

function pollRecompute() {
  const statusEl = document.getElementById('recomputeStatus');
  const btn = document.getElementById('runRecompute');
  fetch('/api/recompute/status').then(r => r.json()).then(s => {
    if (s.running) { setTimeout(pollRecompute, 1500); return; }
    btn.disabled = false;
    if (s.error) { statusEl.textContent = 'error: ' + s.error; return; }
    statusEl.textContent = Object.entries(s.result || {}).map(([k, v]) => `${k}: ${v}`).join(' · ') || 'done';
    loadAll();
  }).catch(() => { statusEl.textContent = 'lost connection while polling'; btn.disabled = false; });
}

document.getElementById('runRecompute').addEventListener('click', async e => {
  const fields = [...document.querySelectorAll('.recompute-check.active')].map(b => b.dataset.field);
  const statusEl = document.getElementById('recomputeStatus');
  const btn = e.target;
  if (!fields.length) { statusEl.textContent = 'pick at least one field'; return; }
  btn.disabled = true;
  statusEl.textContent = 'starting…';
  try {
    const res = await fetch(`/api/recompute?fields=${fields.join(',')}`, { method: 'POST' });
    if (res.status === 202) { statusEl.textContent = 'running…'; pollRecompute(); return; }
    const err = await res.json().catch(() => ({}));
    statusEl.textContent = err.error || `failed (${res.status})`;
    btn.disabled = false;
  } catch {
    statusEl.textContent = 'no server running -- start with: python3 -m internships.webserver';
    btn.disabled = false;
  }
});

// Polls whether .run.lock is held by ANYONE -- this tab's own "Run scrape"
// click, another tab, or a bare terminal `python3 -m internships` /
// --recompute run -- so the live indicator is accurate regardless of who
// started it.
let scrapeWasActive = false;
function pollScrapeActive() {
  fetch('/api/status').then(r => r.json()).then(s => {
    const statusEl = document.getElementById('scrapeStatus');
    const btn = document.getElementById('runScrape');
    if (s.active) {
      scrapeWasActive = true;
      statusEl.textContent = 'scrape running…';
      statusEl.classList.add('live');
      btn.disabled = true;
    } else {
      statusEl.classList.remove('live');
      btn.disabled = false;
      if (scrapeWasActive) {
        scrapeWasActive = false;
        loadAll();
        // only populated if THIS server's own /api/scrape triggered it --
        // a CLI-triggered run leaves this blank, which is fine, the live
        // indicator above already covered the important part
        fetch('/api/scrape/status').then(r => r.json()).then(s2 => {
          if (s2.result) statusEl.textContent = `done — ${s2.result.new_listings} new listings`;
          else if (s2.error) statusEl.textContent = 'error: ' + s2.error;
          else statusEl.textContent = '';
        }).catch(() => { statusEl.textContent = ''; });
      }
    }
  }).catch(() => {});
  setTimeout(pollScrapeActive, 4000);
}

document.getElementById('runScrape').addEventListener('click', async e => {
  const statusEl = document.getElementById('scrapeStatus');
  const btn = e.target;
  btn.disabled = true;
  statusEl.textContent = 'starting…';
  try {
    const res = await fetch('/api/scrape', { method: 'POST' });
    if (res.status === 202) {
      statusEl.textContent = 'scrape running…';
      statusEl.classList.add('live');
      scrapeWasActive = true;
      return;
    }
    const err = await res.json().catch(() => ({}));
    statusEl.textContent = err.error || `failed (${res.status})`;
    btn.disabled = false;
  } catch {
    statusEl.textContent = 'no server running -- start with: python3 -m internships.webserver';
    btn.disabled = false;
  }
});

loadAll();
pollScrapeActive();
</script>
